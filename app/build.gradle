plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.project_photopro'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.project_photopro"
        minSdk = 23
        targetSdk = 37
        versionCode = 5
        versionName = "1.1.2"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            pickFirsts += [
                'lib/arm64-v8a/libc++_shared.so',
                'lib/x86/libc++_shared.so',
                'lib/x86_64/libc++_shared.so',
                'lib/armeabi-v7a/libc++_shared.so'
            ]
        }
    }
    lint {
        // Asset/design warnings that need redesign, not code fixes
        disable 'VectorPath', 'UseCompoundDrawables'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation 'androidx.camera:camera-core:1.6.1'
    implementation 'androidx.camera:camera-camera2:1.6.1'
    implementation 'androidx.camera:camera-lifecycle:1.6.1'
    implementation 'androidx.camera:camera-view:1.6.1'
    implementation 'androidx.camera:camera-extensions:1.6.1'
    implementation 'com.google.mlkit:pose-detection-accurate:18.0.0-beta5'

    implementation 'org.opencv:opencv:5.0.0.1'
}
